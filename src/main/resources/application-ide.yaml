server:
  port: 8083

spring:
  application:
    name: profile-service

  datasource:
    url: jdbc:postgresql://localhost:5432/it_mentor_community_platform?currentSchema=profile_service
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:29092
    topic:
      auth-user-created: auth.user.created
      auth-user-authenticated: auth.user.authenticated
      projects-project-created: projects.project.created
      reviews-review-created: reviews.review.created

feign:
  client:
    auth-service:
      url: http://localhost:8081/api/auth